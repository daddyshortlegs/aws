- name: Setup controller
  become: yes
  hosts: controller
  tasks:
   - name: Create aws directory
     ansible.builtin.file:
       path: "{{ aws_base_path }}/orchestrator"
       state: directory
       owner: andy
       group: andy
       mode: '0755'

   - name: Copy orchestrator binary
     ansible.builtin.copy:
       src: target/release/orchestrator
       dest: "{{ aws_base_path }}/orchestrator/"
       mode: '0755'

   - name: Copy config file
     ansible.builtin.copy:
       src: config.toml
       dest: "{{ aws_base_path }}/orchestrator/config.toml"

   - name: Create systemd service file
     ansible.builtin.copy:
       content: |
         [Unit]
         Description=Orchestrator Rust Server
         After=network.target

         [Service]
         Type=simple
         User=andy
         WorkingDirectory={{ aws_base_path }}/orchestrator
         ExecStart={{ aws_base_path }}/orchestrator/orchestrator
         Restart=always
         RestartSec=10
         Environment="RUST_LOG=info"
         Environment="LISTEN_IP=0.0.0.0"

         [Install]
         WantedBy=multi-user.target
       dest: /etc/systemd/system/orchestrator.service
       mode: '0644'

   - name: Reload systemd daemon
     ansible.builtin.systemd:
       daemon_reload: yes

   - name: Enable and start orchestrator service
     ansible.builtin.systemd:
       name: orchestrator
       enabled: yes
       state: restarted
